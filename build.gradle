plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version "${forgegradle_version}"
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = "${minecraft_version}-${mod_version}"
group = 'com.yu1745.chemicaladdon'
archivesBaseName = 'chemicaladdon'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'chemicaladdon'
            arg '-mixin.config=create.mixins.json'
            property "mixin.env.remapRefMap", "true"
            property "mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg"
            // Auto-enter a local singleplayer world to speed up iteration.
            // Set via -PquickPlayWorld=<name> (defaults to "New World").
            // Leave blank/empty to start normally.
            def quickPlayWorld = (project.findProperty('quickPlayWorld') ?: 'New World') as String
            if (quickPlayWorld?.trim()) {
                args '--quickPlaySingleplayer', quickPlayWorld.trim()
            }
            mods {
                chemicaladdon {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'chemicaladdon'
            // Create's mixins need refmap remapping in dev runs
            arg '-mixin.config=create.mixins.json'
            property "mixin.env.remapRefMap", "true"
            property "mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                chemicaladdon {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run')
            // GameTest runs repeatedly during development; registry-level debug
            // output adds disk/console I/O but does not aid normal test diagnosis.
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'chemicaladdon'
            // Create's mixins need refmap remapping in dev runs
            arg '-mixin.config=create.mixins.json'
            property "mixin.env.remapRefMap", "true"
            property "mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                chemicaladdon {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Create's mixins need refmap remapping in dev runs (same as client/server/gameTestServer)
            arg '-mixin.config=create.mixins.json'
            property "mixin.env.remapRefMap", "true"
            property "mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg"
            args '--mod', 'chemicaladdon', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                chemicaladdon {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://maven.minecraftforge.net" } // ForgeGradle tooling (ForgeAutoRenamingTool etc.)
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.tterrag.com" } // Registrate
    maven { url = "https://maven.blamejared.com/" } // JEI
    // CurseForge Maven: allows runtimeOnly deps like Jade by file id
    maven {
        url 'https://www.cursemaven.com'
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false })
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    implementation(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))

    // Create 6.0.8's mixins depend on Mixinextras (bundled in release jars, needed in dev)
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }

    compileOnly(fg.deobf("mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${jei_minecraft_version}-forge-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${jei_minecraft_version}-forge:${jei_version}"))

    // Jade (client-side helper UI). From CurseForge Maven so it resolves for any
    // clone (no local  jar). File 8479276 = Jade-1.20.1-Forge-11.13.3.
    // NOTE: Jade's mixin refmap ships with official mappings; if the parchment
    // dev runtime cannot apply it, dev runs that load Jade may fail. Production
    // forge1 already runs it natively and is unaffected.
    runtimeOnly(fg.deobf("curse.maven:jade-324717:8479276"))

    // Engine-level unit tests (composition layer is pure Java — only
    // ResourceLocation is touched, which works headless; see src/test/java).
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")

    // chem-engine vendored 内核（原仓库 github.com/yu1745/chem-engine 已封存）：
    // 纯 Java 库不碰 Minecraft 类，无需 fg.deobf；原生库在 resources/native + native/，
    // NativeLoader 运行时解压（fat 分发时 jarJar 内嵌）
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'net.java.dev.jna:jna:5.16.0'
}

def configureJUnitTest = { Test task ->
    task.useJUnitPlatform()
    // The mapped minecraft jar carries ResourceLocation; test JVMs need no
    // Forge bootstrap because nothing touches registries or NBT.
    task.testLogging {
        events "failed", "skipped"
        exceptionFormat "full"
    }
    task.maxParallelForks = 1
}

// Keep Gradle's conventional `test` task as the serial, release-equivalent
// suite. Native IPhreeqc, SpeciesManager and the audit system have shared
// process state and must not be mixed into a parallel fork pool.
test {
    configureJUnitTest(delegate)
}

// Fast check for ordinary blocks, resources and gameplay changes. Composition
// stays here intentionally: its mutable SpeciesManager registry is not safe to
// fork in parallel, but it is inexpensive and directly supports mod behavior.
tasks.register('modTest', Test) {
    group = 'verification'
    description = 'Runs mod-facing composition, reactor and recipe unit tests.'
    configureJUnitTest(delegate)
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'com/yu1745/chemicaladdon/composition/**'
    include 'com/yu1745/chemicaladdon/reactor/**'
    include 'com/yu1745/chemicaladdon/recipe/**'
}

// Pure Java engine tests can use isolated JVM forks. PhysicsAudit changes a
// system property and native/parity suites have not been stress-proven for
// concurrent IPhreeqc use, so both remain in their own serial tasks below.
tasks.register('engineUnitTest', Test) {
    group = 'verification'
    description = 'Runs non-native chem-engine tests in up to two isolated JVM forks.'
    configureJUnitTest(delegate)
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'com/yu1745/chemengine/**'
    exclude 'com/yu1745/chemengine/kernel/**'
    exclude 'com/yu1745/chemengine/PhysicsAuditTest.class'
    maxParallelForks = 2
}

tasks.register('engineAuditTest', Test) {
    group = 'verification'
    description = 'Runs the serial chem-engine physics audit (mutates a system property).'
    configureJUnitTest(delegate)
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'com/yu1745/chemengine/PhysicsAuditTest.class'
}

tasks.register('engineKernelTest', Test) {
    group = 'verification'
    description = 'Runs serial native IPhreeqc kernel and parity tests.'
    configureJUnitTest(delegate)
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'com/yu1745/chemengine/kernel/**'
    include 'com/yu1745/chemicaladdon/parity/**'
}

tasks.register('engineTest') {
    group = 'verification'
    description = 'Runs all engine checks: parallel-safe Java unit tests plus serial audit and native suites.'
    dependsOn 'engineUnitTest', 'engineAuditTest', 'engineKernelTest'
}

// Example for how to get properties into the manifest for reading at runtime.
jar {
    manifest {
        attributes([
                "Specification-Title"     : "chemicaladdon",
                "Specification-Vendor"    : "yu1745",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "yu1745",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')
