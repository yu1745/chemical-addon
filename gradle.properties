# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
# Reuse Gradle's configuration/cache process between iterative compile and GameTest runs.
# The Minecraft server itself still starts fresh for each runGameTestServer invocation.
org.gradle.daemon=true

# Pin JDK 17 (ForgeGradle 6 / Gradle 8.1.1 compatibility; MC 1.20.1 targets Java 17)
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

minecraft_version = 1.20.1
forge_version = 47.4.0

mod_version = 0.1.0

jei_minecraft_version = 1.20.1
jei_version = 15.20.0.106

create_version = 6.0.8-289
ponder_version = 1.0.91
flywheel_version = 1.0.5
registrate_version = MC1.20-1.3.3

forgegradle_version = 6.0.6
mixin_version = 0.8.5
parchment_version = 2023.06.26
